<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<meta name="robots" content="noindex,nofollow">
<title>后台 · 灵魂成分表</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.adm{max-width:820px;margin:0 auto;padding:26px 20px 60px}
.adm h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.adm .sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);padding:16px 17px;margin-bottom:14px}
.card h3{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.stats div{background:var(--card);padding:14px}
.stats b{display:block;font-family:var(--serif);font-size:22px;font-weight:500}
.stats span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.field{flex:1;min-width:92px}
.field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px;letter-spacing:.08em}
.field input{width:100%;height:42px;padding:0 11px;border:1px solid var(--line);background:#fff;border-radius:2px;font:inherit;font-size:14px;outline:none}
.field input:focus{border-color:var(--ink)}
.mini{height:42px;padding:0 16px;background:var(--ink);color:#FCFAF4;font-size:13px;font-weight:600;border-radius:2px}
.mini.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.codes{display:grid;gap:8px;margin-top:4px}
.code-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line-soft);background:#fff;font-family:var(--mono);font-size:13px}
.code-row .u{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.code-row .s{font-family:inherit;font-size:10px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.code-row .s.on{color:var(--green);border-color:rgba(45,90,76,.4)}
.code-row .s.out{color:var(--red);border-color:rgba(211,63,39,.35)}
.code-row button{font-size:10.5px;color:var(--muted);text-decoration:underline;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:10.5px;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12px}
.tbl td.n{font-family:inherit}
.hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.7}
.bar{display:flex;gap:8px;margin-top:14px}
.bar button{flex:1;height:42px;border:1px solid var(--ink);font-size:13px;font-weight:600}
.err{color:var(--red);font-size:12.5px;min-height:18px;margin:6px 0}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="adm" id="adm"></div>
<div id="toast" class="toast"></div>

<script src="assets/config.js"></script>
<script src="assets/backend.js"></script>
<script src="assets/soul-label-data.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.SOUL_CONFIG;
  var root = document.getElementById('adm');
  var toastEl = document.getElementById('toast');
  var pass = sessionStorage.getItem('soul.admin.pass') || '';
  var codes = [];
  var stats = null;
  var busy = false;

  function toast(m) {
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(code) { return code.length === 10 ? code.slice(0, 2) + '-' + code.slice(2, 6) + '-' + code.slice(6) : code; }

  function rpc(name, args) {
    return Promise.resolve().then(function () {
      return window.SoulBackend.rpc(name, args);
    });
  }

  function copy(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }).catch(function () { return fb(t); });
    }
    return Promise.resolve(fb(t));
  }
  function fb(t) {
    try {
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
    } catch (e) { return false; }
  }

  function gate(err) {
    root.innerHTML =
      '<h1>灵魂成分表 · 后台</h1>' +
      '<div class="sub">生成测评密码、查看使用情况</div>' +
      '<div class="card" style="max-width:420px">' +
        '<h3>管理员口令</h3>' +
        '<div class="field"><input id="ap" type="password" placeholder="输入口令" autocomplete="current-password"></div>' +
        '<div class="err" id="aerr">' + esc(err || '') + '</div>' +
        '<button class="mini" id="ago" style="width:100%">进入</button>' +
      '</div>';
    var go = function () {
      var v = document.getElementById('ap').value.trim();
      if (!v) return;
      pass = v;
      load();
    };
    document.getElementById('ago').onclick = go;
    document.getElementById('ap').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    document.getElementById('ap').focus();
  }

  function dash() {
    var unused = codes.filter(function (c) { return c.active && c.used < c.maxUses; });
    root.innerHTML =
      '<h1>灵魂成分表 · 后台</h1>' +
      '<div class="sub">口令已验证 · <a href="#" id="aout" style="color:var(--muted)">退出</a></div>' +
      '<div class="stats">' +
        '<div><b>' + (stats ? stats.codes : '-') + '</b><span>密码总数</span></div>' +
        '<div><b>' + (stats ? stats.uses : '-') + '</b><span>已用次数</span></div>' +
        '<div><b>' + (stats ? stats.capacity : '-') + '</b><span>总可测次数</span></div>' +
        '<div><b>' + (stats ? stats.results : '-') + '</b><span>已生成结果</span></div>' +
      '</div>' +

      '<div class="card">' +
        '<h3>生成新密码</h3>' +
        '<div class="row">' +
          '<div class="field"><label>数量</label><input id="n" type="number" value="20" min="1" max="100"></div>' +
          '<div class="field"><label>每张可用次数</label><input id="u" type="number" value="3" min="1" max="99"></div>' +
          '<div class="field" style="flex:2"><label>备注（批次/渠道）</label><input id="note" type="text" placeholder="例如 小红书 10 月"></div>' +
          '<button class="mini" id="gen">生成</button>' +
        '</div>' +
        '<div class="err" id="gerr"></div>' +
        '<div class="codes" id="newcodes"></div>' +
        '<p class="hint">生成的密码只在这里显示一次，页面关闭后仍可在下面列表里查到。</p>' +
      '</div>' +

      '<div class="card">' +
        '<h3>全部密码（' + codes.length + '）</h3>' +
        '<div class="bar">' +
          '<button class="mini ghost" id="copyunused">复制所有未用完的</button>' +
          '<button class="mini ghost" id="refresh">刷新</button>' +
        '</div>' +
        '<div class="codes" style="margin-top:14px">' +
          (codes.length ? codes.map(function (c) {
            var left = c.maxUses - c.used;
            var cls = !c.active ? 'out' : (left <= 0 ? 'out' : 'on');
            var txt = !c.active ? '停用' : (left <= 0 ? '已用完' : '剩 ' + left + ' 次');
            return '<div class="code-row"><span>' + esc(fmt(c.code)) + '</span>' +
              '<span class="s ' + cls + '">' + txt + '</span>' +
              '<span class="u">' + c.used + '/' + c.maxUses + (c.note ? ' · ' + esc(c.note) : '') + '</span>' +
              '<button data-copy="' + esc(c.code) + '">复制</button></div>';
          }).join('') : '<p class="hint">还没有密码，先生成一批。</p>') +
        '</div>' +
      '</div>' +

      (stats && stats.recent && stats.recent.length
        ? '<div class="card"><h3>最近生成的结果</h3><table class="tbl"><thead><tr><th>时间</th><th>主料</th></tr></thead><tbody>' +
          stats.recent.map(function (r) {
            var a = (window.SOUL_LABEL.archetypes[r.archetype] || {}).name || r.archetype;
            return '<tr><td>' + new Date(r.createdAt).toLocaleString('zh-CN') + '</td><td class="n">' + esc(a) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '');

    document.getElementById('aout').onclick = function (e) {
      e.preventDefault();
      sessionStorage.removeItem('soul.admin.pass');
      pass = ''; gate();
    };
    document.getElementById('refresh').onclick = load;
    document.getElementById('copyunused').onclick = function () {
      var list = codes.filter(function (c) { return c.active && c.used < c.maxUses; }).map(function (c) { return fmt(c.code); });
      if (!list.length) { toast('没有可用的密码'); return; }
      copy(list.join('\n')).then(function (ok) { toast(ok ? '已复制 ' + list.length + ' 个密码' : '复制失败'); });
    };
    document.getElementById('gen').onclick = function () {
      if (busy) return;
      var n = Math.max(1, Math.min(100, parseInt(document.getElementById('n').value, 10) || 1));
      var u = Math.max(1, Math.min(99, parseInt(document.getElementById('u').value, 10) || 3));
      var note = document.getElementById('note').value.trim() || null;
      busy = true;
      document.getElementById('gen').textContent = '生成中…';
      rpc('soul_admin_create_codes', { p_pass: pass, p_count: n, p_uses: u, p_note: note }).then(function (r) {
        busy = false;
        if (!r || !r.ok) {
          document.getElementById('gerr').textContent = r && r.reason === 'bad_pass' ? '口令错误' : '生成失败';
          document.getElementById('gen').textContent = '生成';
          return;
        }
        document.getElementById('gerr').textContent = '';
        document.getElementById('newcodes').innerHTML = r.codes.map(function (c) {
          return '<div class="code-row"><span>' + esc(fmt(c)) + '</span><span class="s on">新建</span><button data-copy="' + esc(c) + '">复制</button></div>';
        }).join('') + '<button class="mini" id="copynew" style="margin-top:6px">复制这 ' + r.codes.length + ' 个</button>';
        document.getElementById('copynew').onclick = function () {
          copy(r.codes.map(fmt).join('\n')).then(function (ok) { toast(ok ? '已复制' : '复制失败'); });
        };
        load();
      }).catch(function (e) {
        busy = false;
        document.getElementById('gen').textContent = '生成';
        document.getElementById('gerr').textContent = '连接失败：' + e.message;
      });
    };
  }

  function load() {
    root.innerHTML = '<h1>灵魂成分表 · 后台</h1><div class="sub">加载中…</div>';
    Promise.all([
      rpc('soul_admin_list_codes', { p_pass: pass }),
      rpc('soul_admin_stats', { p_pass: pass })
    ]).then(function (arr) {
      var list = arr[0], st = arr[1];
      if (!list || !list.ok) {
        sessionStorage.removeItem('soul.admin.pass');
        pass = '';
        gate('口令不对');
        return;
      }
      codes = list.codes || [];
      stats = st && st.ok ? st : null;
      sessionStorage.setItem('soul.admin.pass', pass);
      dash();
    }).catch(function (e) {
      gate('连接失败：' + e.message);
    });
  }

  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-copy]') : null;
    if (!b) return;
    copy(b.getAttribute('data-copy')).then(function (ok) { toast(ok ? '已复制' : '复制失败'); });
  });

  if (pass) load(); else gate();
})();
</script>
</body>
</html>
